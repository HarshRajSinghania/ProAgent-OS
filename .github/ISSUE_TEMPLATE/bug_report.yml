name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ProAgent OS. Please fill in as much as you can.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
      placeholder: e.g. Specialist tool loop hangs after 2 rounds with OpenAI-compatible provider
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps starting from a clean checkout
      placeholder: |
        1. python scripts/demo_live.py with …
        2. …
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stack traces / logs (redact API keys)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: git rev-parse --short HEAD or release tag
      placeholder: e.g. 5687549
    validations:
      required: false
  - type: dropdown
    id: env
    attributes:
      label: How are you running it?
      options:
        - Local venv + uvicorn
        - Docker Compose
        - Other
    validations:
      required: true
  - type: input
    id: llm
    attributes:
      label: LLM provider
      description: mock / openai-compatible base URL + model (no API keys)
      placeholder: openai-compatible · mimo-v2.6-pro
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I redacted API keys and secrets from logs
          required: true
        - label: I searched existing issues for duplicates
          required: false
